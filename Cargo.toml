[package]
name = "orders-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "orders_service"
path = "src/lib.rs"

[[bin]]
name = "orders-service"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[dev-dependencies]
anyhow = "1.0.104"
mockall = "0.15.0"
pact_consumer = "1.4.10"
pact_models = "1.3.15"
pact_verifier = "1.4.7"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
wiremock = "0.6.5"
